[project]
name = "Frontend"
version = "0.1.3"
description = "Default template for PDM package"
authors = [
    {name = "Louis", email = "louis@moises.fr"},
]
dependencies = ["requests>=2.32.4", "streamlit>=1.48.1", "plotly>=6.3.0", "dotenv>=0.9.9"]
